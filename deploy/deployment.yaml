apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-k8s-cert-exporter
  namespace: k8s-cert-exporter
  labels:
    app.kubernetes.io/name: prometheus-k8s-cert-exporter
    app.kubernetes.io/component: exporter

spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-k8s-cert-exporter

  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-k8s-cert-exporter
        app.kubernetes.io/component: exporter

    spec:
      serviceAccountName: prometheus-k8s-cert-exporter
      enableServiceLinks: false

      securityContext:
        runAsNonRoot: true

        seccompProfile:
          type: RuntimeDefault

        appArmorProfile:
          type: RuntimeDefault

      containers:
        - name: exporter

          image: ghcr.io/marcobucci77/prometheus-k8s-cert-exporter@sha256:<DIGEST>
          imagePullPolicy: IfNotPresent

          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true

            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532

            capabilities:
              drop:
                - ALL

          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

      terminationGracePeriodSeconds: 30