apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-k8s-cert-exporter
  namespace: k8s-cert-exporter
  labels:
    app.kubernetes.io/name: prometheus-k8s-cert-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-k8s-cert-exporter

  namespaceSelector:
    matchNames:
      - k8s-cert-exporter

  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 60s
      scrapeTimeout: 15s